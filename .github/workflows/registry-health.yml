name: Registry health

# Weekly live key check of every enabled member of the GitHub registry on the
# default branch. A failure opens one issue labelled registry-health, or
# updates and comments on the open one; the issue is closed when every check
# passes again. Members are never disabled automatically: who the federation
# trusts changes only through pull requests.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-health
  cancel-in-progress: false

jobs:
  live-check:
    name: Live-check every member
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: task install
      - run: task build
      - name: Validate the registry and live-check every member
        id: check
        shell: bash
        run: |
          shopt -s nullglob
          members=(registry/*.json)
          status=0
          node dist/cli.js validate registry config/trust-anchor.json \
            --live "${members[@]}" > report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the health issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=registry-health
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Weekly live key check of registry members"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" \
            --state open --json number --jq '.[0].number // empty')
          if [ "$STATUS" != "0" ]; then
            {
              echo "The weekly live key check of the GitHub registry failed on $(date -u +%Y-%m-%d) ([run]($RUN_URL))."
              echo
              echo "Failing members are still served. Fix the member's Entity Configuration, or update, disable or remove its file in \`registry/\` by pull request."
              echo
              cat report.md
            } > issue.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file issue.md
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
                --title "Registry health: live key checks are failing" --body-file issue.md
            fi
            exit "$STATUS"
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "All live key checks pass again: $RUN_URL"
          fi
